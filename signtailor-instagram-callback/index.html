<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signtailor Instagram OAuth Callback</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f5ef; color: #1f2933; }
      main { width: min(92vw, 480px); padding: 28px; border-radius: 18px; background: #fff; box-shadow: 0 18px 48px rgba(15, 23, 42, 0.14); }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 12px; line-height: 1.6; color: #5f6b7a; }
      code { word-break: break-all; }
      .muted { font-size: 13px; color: #8792a2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Instagram 연결을 앱으로 전달하는 중입니다</h1>
      <p>잠시 후 Signtailor 앱으로 돌아갑니다. 브라우저에서 로컬 앱 접근 확인이 나오면 허용해주세요.</p>
      <p class="muted">자동으로 이동하지 않으면 Signtailor 앱이 실행 중인지 확인한 뒤 OAuth 연결을 다시 시도하세요.</p>
      <p class="muted"><code id="target"></code></p>
    </main>
    <script>
      const localCallback = new URL('http://localhost:43052/instagram/callback');
      localCallback.search = window.location.search;
      document.getElementById('target').textContent = localCallback.toString();
      window.location.replace(localCallback.toString());
    </script>
  </body>
</html>
