<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jerjangmin.github.io</title>
    <meta
      name="description"
      content="기능 선택 화면에서 Musicbook과 종토방 이미지 메이커로 바로 이동할 수 있습니다."
    />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">기능 선택</p>
        <h1>바로 쓸 기능을 고르세요.</h1>
        <p class="hero-copy">
          필요한 도구만 빠르게 열 수 있게 첫 화면을 단순하게 정리했습니다. 노래책은
          <code>/musicbook</code>, 종토방 메이커는 <code>/jongtobang</code>에서 바로
          사용할 수 있습니다.
        </p>
      </section>

      <section class="feature-grid" aria-label="available features">
        <a class="feature-card musicbook" href="/musicbook/">
          <span class="feature-kicker">Musicbook</span>
          <strong>노래책</strong>
          <p>곡 검색, 필터링, 앨범아트 확인이 가능한 정적 노래책입니다.</p>
          <span class="feature-path">/musicbook/</span>
        </a>

        <a class="feature-card jongtobang" href="/jongtobang/">
          <span class="feature-kicker">Image Maker</span>
          <strong>종토방 이미지 메이커</strong>
          <p>토스 종토방 스타일 피드를 만들고 PNG로 바로 저장할 수 있습니다.</p>
          <span class="feature-path">/jongtobang/</span>
        </a>
      </section>
    </main>
  </body>
</html>
