<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아카이브 — 소미랜드</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon_io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/apple-touch-icon.png">
  <meta property="og:title" content="아카이브 — 소미랜드">
  <meta property="og:description" content="작업하면서 만든 자료들을 모아둔 공간">
  <meta property="og:type" content="website">
  <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">소미랜드</a>
      <nav class="nav">
        <a href="https://jerjangmin.github.io">포트폴리오</a>
      </nav>
    </div>
  </header>

  <!-- Intro -->
  <section class="intro">
    <div class="container">
      <h1 class="intro-title">아카이브</h1>
      <p class="intro-desc">작업하면서 만든 자료들을 모아둔 공간</p>
    </div>
  </section>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="container">
      <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-filter="all">전체</button>
      </div>
    </div>
  </div>

  <!-- Resource List -->
  <main class="resource-list">
    <div class="container" id="resourceContainer">
      <div class="empty-state" id="emptyState">
        <p>등록된 자료가 없습니다.</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-info">
          <p>상호명: 소미랜드 | 대표자: 민다솜 | 개인정보책임자: 민다솜</p>
          <p>사업자등록번호: 263-31-01680 | 통신판매업신고번호: 2025-서울관악-0179</p>
          <p>주소: 경기도 의정부시 신흥로 234 CRC빌딩 10층 S13_4호</p>
        </div>
        <div class="footer-contact">
          문의: <a href="tel:010-5958-1199">010-5958-1199</a> · <a href="mailto:contact@mindasom.com">contact@mindasom.com</a>
        </div>
        <div class="footer-copyright">
          &copy; 소미랜드 2025
        </div>
      </div>
    </div>
  </footer>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const ICON_MAP = {
      '문서': 'file-text',
      '스프레드시트': 'table',
      '프레젠테이션': 'presentation',
      '그래픽 리소스': 'image',
      '영상 리소스': 'video',
      '오디오': 'music',
      '폰트': 'type',
      '계산기/도구': 'wrench',
      '압축파일': 'archive',
      '기타': 'file'
    };

    const EXT_LABEL = {
      pdf: 'PDF', md: 'Markdown', txt: 'TXT', doc: 'Word', docx: 'Word',
      hwp: 'HWP', hwpx: 'HWP', xlsx: 'Excel', xls: 'Excel', csv: 'CSV',
      pptx: 'PPT', ppt: 'PPT', key: 'Keynote',
      psd: 'PSD', ai: 'AI', eps: 'EPS', svg: 'SVG',
      png: 'PNG', jpg: 'JPG', jpeg: 'JPG', webp: 'WebP', gif: 'GIF', tiff: 'TIFF', fig: 'Figma',
      mp4: 'MP4', mov: 'MOV', avi: 'AVI', webm: 'WebM',
      mp3: 'MP3', wav: 'WAV', aac: 'AAC', ogg: 'OGG',
      ttf: 'TTF', otf: 'OTF', woff: 'WOFF', woff2: 'WOFF2',
      html: 'HTML', xlsm: 'Excel Macro',
      zip: 'ZIP', rar: 'RAR', '7z': '7Z', tar: 'TAR', gz: 'GZ'
    };

    function createCard(file) {
      const icon = ICON_MAP[file.category] || 'file';
      const extLabel = EXT_LABEL[file.extension] || file.extension.toUpperCase();
      const dateStr = file.date.replace(/-/g, '.');

      return `<article class="resource-card" data-category="${file.category}">
        <div class="resource-meta">
          <span class="resource-tag">${file.category}</span>
          <span class="resource-date">${dateStr}</span>
        </div>
        <h2 class="resource-title">${file.title}</h2>
        <div class="resource-file">
          <span class="resource-file-info">
            <i data-lucide="${icon}"></i>
            ${extLabel} · ${file.size}
          </span>
          <a href="${file.path}" class="download-btn" download>
            <i data-lucide="download"></i>
            다운로드
          </a>
        </div>
      </article>`;
    }

    function bindFilters() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelector('.filter-btn.active').classList.remove('active');
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          document.querySelectorAll('.resource-card').forEach(card => {
            card.style.display = filter === 'all' || card.dataset.category === filter ? '' : 'none';
          });
        });
      });
    }

    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('resourceContainer');
        const emptyState = document.getElementById('emptyState');
        const filterButtons = document.getElementById('filterButtons');

        if (!data.files || data.files.length === 0) {
          emptyState.style.display = '';
          return;
        }

        emptyState.style.display = 'none';

        // 날짜순 정렬 (최신순)
        data.files.sort((a, b) => b.date.localeCompare(a.date));

        // 카드 렌더링
        const cardsHTML = data.files.map(createCard).join('');
        container.insertAdjacentHTML('beforeend', cardsHTML);

        // 필터 버튼 동적 생성 (data.json에 존재하는 카테고리만)
        const categories = [...new Set(data.files.map(f => f.category))];
        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'filter-btn';
          btn.dataset.filter = cat;
          btn.textContent = cat;
          filterButtons.appendChild(btn);
        });

        bindFilters();
        lucide.createIcons();
      })
      .catch(() => {
        document.getElementById('emptyState').style.display = '';
      });
  </script>

</body>
</html>
