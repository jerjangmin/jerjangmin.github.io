<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- 배경 -->
  <circle cx="40" cy="40" r="36" fill="#FFF8F0" stroke="#C4A77D" stroke-width="2"/>

  <!-- 화분 -->
