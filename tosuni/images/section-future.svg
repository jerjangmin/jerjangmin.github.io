  <!-- 흙 -->
  <ellipse cx="40" cy="55" rx="10" ry="3" fill="#8B7355"/>

  <!-- 새싹 줄기 -->
  <path d="M40 55 L40 35" stroke="#8B7355" stroke-width="2"/>

  <!-- 잎 (왼쪽) -->
  <ellipse cx="34" cy="40" rx="6" ry="10" fill="#C4A77D" transform="rotate(-30, 34, 40)"/>

  <!-- 잎 (오른쪽) -->
  <ellipse cx="46" cy="40" rx="6" ry="10" fill="#C4A77D" transform="rotate(30, 46, 40)"/>

  <!-- 꼭대기 새 잎 -->
  <ellipse cx="40" cy="30" rx="4" ry="8" fill="#FFB5BA"/>

  <!-- 반짝임 -->
  <circle cx="55" cy="25" r="2" fill="#FFB5BA"/>
  <circle cx="25" cy="30" r="1.5" fill="#FFB5BA"/>
