<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 배경 원 -->
  <circle cx="60" cy="60" r="56" fill="#FFF8F0" stroke="#C4A77D" stroke-width="2"/>

  <!-- 토끼 귀 (왼쪽) -->
  <ellipse cx="40" cy="28" rx="10" ry="20" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>
  <ellipse cx="40" cy="28" rx="5" ry="12" fill="#FFB5BA"/>

  <!-- 토끼 귀 (오른쪽) -->
  <ellipse cx="80" cy="28" rx="10" ry="20" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>
  <ellipse cx="80" cy="28" rx="5" ry="12" fill="#FFB5BA"/>

  <!-- 얼굴 -->
  <circle cx="60" cy="65" r="30" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>

  <!-- 눈 (왼쪽) -->
  <circle cx="48" cy="60" r="4" fill="#2D2D2D"/>
  <circle cx="49" cy="59" r="1.5" fill="#FFFFFF"/>

  <!-- 눈 (오른쪽) -->
  <circle cx="72" cy="60" r="4" fill="#2D2D2D"/>
  <circle cx="73" cy="59" r="1.5" fill="#FFFFFF"/>

  <!-- 볼터치 -->
  <ellipse cx="40" cy="70" rx="6" ry="4" fill="#FFB5BA" opacity="0.6"/>
  <ellipse cx="80" cy="70" rx="6" ry="4" fill="#FFB5BA" opacity="0.6"/>

  <!-- 코 -->
  <ellipse cx="60" cy="70" rx="3" ry="2" fill="#C4A77D"/>

  <!-- 입 (미소) -->
  <path d="M54 76 Q60 82 66 76" stroke="#8B7355" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 펜 (작가 상징) -->
  <g transform="translate(78, 80) rotate(-30)">
    <rect x="0" y="0" width="6" height="20" rx="1" fill="#8B7355"/>
    <polygon points="3,20 0,28 6,28" fill="#2D2D2D"/>
    <rect x="0" y="0" width="6" height="4" fill="#C4A77D"/>
  </g>
</svg>
