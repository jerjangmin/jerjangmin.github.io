<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 배경 원 -->
  <circle cx="60" cy="60" r="56" fill="#FFF8F0" stroke="#C4A77D" stroke-width="2"/>

  <!-- 토끼 귀 (왼쪽) -->
  <ellipse cx="40" cy="28" rx="10" ry="20" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>
  <ellipse cx="40" cy="28" rx="5" ry="12" fill="#FFB5BA"/>

  <!-- 토끼 귀 (오른쪽) -->
  <ellipse cx="80" cy="28" rx="10" ry="20" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>
  <ellipse cx="80" cy="28" rx="5" ry="12" fill="#FFB5BA"/>

  <!-- 얼굴 -->
  <circle cx="60" cy="65" r="30" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>

  <!-- 눈 (왼쪽) - 행복한 눈 (^) -->
  <path d="M44 58 Q48 54 52 58" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 눈 (오른쪽) - 행복한 눈 (^) -->
  <path d="M68 58 Q72 54 76 58" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 볼터치 - 더 진하게 -->
  <ellipse cx="40" cy="68" rx="8" ry="5" fill="#FFB5BA" opacity="0.7"/>
  <ellipse cx="80" cy="68" rx="8" ry="5" fill="#FFB5BA" opacity="0.7"/>

  <!-- 코 -->
  <ellipse cx="60" cy="70" rx="3" ry="2" fill="#C4A77D"/>

  <!-- 입 (활짝 웃음) -->
  <path d="M50 76 Q60 86 70 76" stroke="#8B7355" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 반짝임 -->
  <g fill="#FFB5BA">
    <polygon points="20,45 22,50 27,50 23,53 25,58 20,55 15,58 17,53 13,50 18,50" transform="scale(0.6) translate(10, 10)"/>
    <polygon points="100,30 102,35 107,35 103,38 105,43 100,40 95,43 97,38 93,35 98,35" transform="scale(0.5)"/>
  </g>

  <!-- 하트 -->
  <path d="M98 70 C98 66 102 66 102 70 C102 66 106 66 106 70 C106 76 102 80 102 80 C102 80 98 76 98 70" fill="#FFB5BA"/>
</svg>
