<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 배경 원 -->
  <circle cx="60" cy="60" r="56" fill="#FFF8F0" stroke="#C4A77D" stroke-width="2"/>

  <!-- 토끼 귀 (왼쪽) - 살짝 기울임 -->
  <ellipse cx="38" cy="30" rx="10" ry="20" fill="#F5E6D3" stroke="#8B7355" stroke-width="2" transform="rotate(-10, 38, 30)"/>
  <ellipse cx="38" cy="30" rx="5" ry="12" fill="#FFB5BA" transform="rotate(-10, 38, 30)"/>

  <!-- 토끼 귀 (오른쪽) -->
  <ellipse cx="80" cy="28" rx="10" ry="20" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>
  <ellipse cx="80" cy="28" rx="5" ry="12" fill="#FFB5BA"/>

  <!-- 얼굴 -->
  <circle cx="60" cy="65" r="30" fill="#F5E6D3" stroke="#8B7355" stroke-width="2"/>

  <!-- 눈 (왼쪽) - 생각하는 표정 -->
  <line x1="44" y1="58" x2="52" y2="58" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

  <!-- 눈 (오른쪽) - 생각하는 표정 -->
  <line x1="68" y1="58" x2="76" y2="58" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

  <!-- 볼터치 -->
  <ellipse cx="40" cy="70" rx="6" ry="4" fill="#FFB5BA" opacity="0.6"/>
  <ellipse cx="80" cy="70" rx="6" ry="4" fill="#FFB5BA" opacity="0.6"/>

  <!-- 코 -->
  <ellipse cx="60" cy="70" rx="3" ry="2" fill="#C4A77D"/>

  <!-- 입 (음~ 하는 표정) -->
  <ellipse cx="60" cy="78" rx="4" ry="3" fill="#C4A77D"/>

  <!-- 생각 말풍선 -->
  <circle cx="95" cy="25" r="4" fill="#C4A77D" opacity="0.5"/>
  <circle cx="102" cy="18" r="3" fill="#C4A77D" opacity="0.4"/>
  <circle cx="107" cy="12" r="2" fill="#C4A77D" opacity="0.3"/>
</svg>
