<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARD 펄러비즈 A4 도안 생성기</title>
    <meta
      name="description"
      content="이미지를 업로드하면 MARD 221 색상표 기준으로 A4 출력용 펄러비즈 도안을 생성합니다."
    />
    <link rel="stylesheet" href="/perler/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <a class="home-link" href="/">← 기능 선택으로</a>
        <p class="eyebrow">MARD 221 · A4 print pattern</p>
        <h1>펄러비즈 도안을 A4로 바로 만드세요.</h1>
        <p class="hero-copy">
          이미지를 올리면 먼저 픽셀아트처럼 정리한 뒤 도트 크기를 감지하고, 중국에서 많이 쓰는
          MARD 221색 A~M 차트 기준으로 사각형 도안과 예상 완성본을 생성합니다.
        </p>
      </header>

      <section class="tool-card" aria-label="펄러비즈 도안 생성 도구">
        <div class="controls">
          <label class="drop-zone" for="imageInput" id="dropZone">
            <span class="drop-icon">▦</span>
            <strong>이미지 업로드</strong>
            <span>PNG, JPG, WebP 이미지를 드래그하거나 선택하세요.</span>
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          </label>

          <div class="options-grid">
            <label>
              <span>도트 크기</span>
              <select id="scaleMode">
                <option value="auto">자동 감지</option>
                <option value="1">1px</option>
                <option value="2">2px</option>
                <option value="3">3px</option>
                <option value="4">4px</option>
                <option value="6">6px</option>
                <option value="8">8px</option>
                <option value="12">12px</option>
                <option value="16">16px</option>
                <option value="20">20px</option>
                <option value="24">24px</option>
              </select>
            </label>

            <label>
              <span>A4 방향</span>
              <select id="orientation">
                <option value="landscape" selected>가로</option>
                <option value="portrait">세로</option>
                <option value="auto">자동</option>
              </select>
            </label>

            <label>
              <span>출력 DPI</span>
              <select id="dpi">
                <option value="150">150dpi</option>
                <option value="300" selected>300dpi</option>
              </select>
            </label>

            <label>
              <span>최대 도안 크기</span>
              <select id="maxCells">
                <option value="6">긴 변 6칸</option>
                <option value="12">긴 변 12칸</option>
                <option value="16">긴 변 16칸</option>
                <option value="24">긴 변 24칸</option>
                <option value="32">긴 변 32칸</option>
                <option value="48" selected>긴 변 48칸</option>
                <option value="64">긴 변 64칸</option>
                <option value="96">긴 변 96칸</option>
                <option value="0">원본 유지</option>
              </select>
            </label>

            <label class="check-row">
              <input id="cleanSource" type="checkbox" checked />
              <span>도트 감지 전 픽셀아트 정리</span>
            </label>
          </div>

          <div class="actions">
            <button id="generateBtn" type="button" disabled>도안 만들기</button>
            <button id="downloadBtn" type="button" disabled>PNG 다운로드</button>
          </div>

          <p class="status" id="status">이미지를 업로드하면 도안을 만들 수 있습니다.</p>
        </div>

        <aside class="source-preview" aria-label="입력 이미지 미리보기">
          <div class="preview-box">
            <img id="sourcePreview" alt="업로드한 이미지 미리보기" hidden />
            <span id="previewPlaceholder">미리보기</span>
          </div>
          <dl class="meta-list">
            <div><dt>원본</dt><dd id="originalMeta">-</dd></div>
            <div><dt>감지</dt><dd id="scaleMeta">-</dd></div>
            <div><dt>도안</dt><dd id="patternMeta">-</dd></div>
            <div><dt>색상</dt><dd id="colorMeta">-</dd></div>
          </dl>
        </aside>
      </section>

      <section class="result-section" aria-label="생성된 A4 도안">
        <div class="result-header">
          <h2>A4 출력 미리보기</h2>
          <p>기본은 A4 가로입니다. 큰 이미지는 긴 변 48칸 기준으로 자동 리사이즈한 뒤 도안을 만듭니다.</p>
        </div>
        <div class="canvas-frame">
          <canvas id="resultCanvas" aria-label="A4 펄러비즈 도안"></canvas>
        </div>
      </section>
    </main>

    <script src="/perler/app.js"></script>
  </body>
</html>
