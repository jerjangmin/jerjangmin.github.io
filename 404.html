<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 찾을 수 없습니다</title>
    <meta name="description" content="원하는 기능 선택 화면으로 돌아가세요." />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">404</p>
        <h1>페이지를 찾을 수 없습니다.</h1>
        <p class="hero-copy">
          주소가 바뀌었거나 잘못 입력됐을 수 있습니다. 아래 기능 선택 화면에서 다시
          이동하세요.
        </p>
      </section>

      <section class="feature-grid" aria-label="recovery links">
        <a class="feature-card neutral" href="/">
          <span class="feature-kicker">Home</span>
          <strong>기능 선택으로 돌아가기</strong>
          <p>루트 화면에서 사용할 도구를 다시 선택할 수 있습니다.</p>
          <span class="feature-path">/</span>
        </a>

        <a class="feature-card musicbook" href="/musicbook/">
          <span class="feature-kicker">Musicbook</span>
          <strong>노래책 열기</strong>
          <p>기존 메인 페이지로 쓰이던 노래책은 이제 별도 경로로 이동했습니다.</p>
          <span class="feature-path">/musicbook/</span>
        </a>
      </section>
    </main>
  </body>
</html>
